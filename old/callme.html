<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Benson Wu</title>

    <link rel="icon" type="image/webp" href="images/headportrait/myicon.webp">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav.css">
    <!-- 載入昭源圓體 .ttf -->
    <link rel="preload" href="fonts/ChironGoRoundTC-400R.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="fonts/ChironGoRoundTC-700B.ttf" as="font" type="font/ttf" crossorigin>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700&family=Source+Code+Pro:wght@400;700&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <meta name="theme-color" content="#0a0a0c">
</head>

<body>
    <div id="nav-placeholder"></div>

    <div class="smooth-scroll-wrapper">
        <main class="page-content-wrapper contact-page-wrapper">

            <section class="contact-hero">
                <div class="contact-glass-card" data-scroll="fade-up">
                    <div class="contact-avatar-wrapper">
                        <img src="images/headportrait/S_11296777.webp" alt="Benson Wu" class="contact-avatar" fetchpriority="high">
                    </div>

                    <h1 class="page-title" data-scroll="fade-up">Let's <span class="accent-text">Connect</span></h1>
                    <p class="contact-subtitle" data-scroll="fade-up">歡迎透過社群平台或 Email 與我聯繫交流！</p>

                    <div class="contact-info-list" data-scroll="fade-up">
                        <div class="info-item">
                            <span class="material-symbols-outlined icon-blue">mail</span>
                            <span id="profile-email">wub0419666work@gmail.com</span>
                        </div>
                    </div>

                    <h3 class="social-title" data-scroll="fade-up">Find me on</h3>
                    <!-- 社群連結由 render.js 根據 data.js 產生 -->
                    <div class="social-links-bento dynamic-social-links contact-social-bar" data-scroll="fade-up">
                    </div>

                    <a href="mailto:wub0419666work@gmail.com?subject=你好，想與您聯繫&body=您的姓名：%0A聯絡電話：%0A問題描述：%0A"
                        class="btn btn-primary magnetic-btn send-email-btn" data-scroll="fade-up">
                        Send Email <span class="material-symbols-outlined">send</span>
                    </a>
                </div>
            </section>

        </main>

        <!-- Footer 由 components.js 自動載入 footer.html -->
        <div id="footer-placeholder"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/components.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="js/animations.js"></script>
</body>

</html>
