<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Benson Wu</title>
    
    <link rel="icon" type="image/webp" href="images/headportrait/myicon.webp">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav.css">
    <!-- 載入昭源圓體 .ttf -->
    <link rel="preload" href="fonts/ChironGoRoundTC-400R.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="fonts/ChironGoRoundTC-700B.ttf" as="font" type="font/ttf" crossorigin>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <meta name="theme-color" content="#0a0a0c">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="smooth-scroll-wrapper">
        <main class="page-content-wrapper">
            
            <!-- ==============================================
                 簡介區塊 (Bio Section)
            =============================================== -->
            <section class="bio-section">
                <h1 class="page-title" data-scroll="fade-up">About <span class="accent-text">Benson</span></h1>
                <div class="bio-content bento-card" data-scroll="fade-up">
                    <!-- Bio 文字會由 render.js 自動塞入 -->
                    <p id="about-bio" class="bio-text"></p>
                </div>
            </section>

            <!-- ==============================================
                 經驗與活動時間軸 (Experiences Timeline)
                 這是一個直向的 Timeline 設計。
                 裡面的內容完全由 data.js 中的 experiences 陣列動態生成！
            =============================================== -->
            <section class="experience-section">
                <h2 class="section-heading text-center" data-scroll="fade-up">Experiences & Activities</h2>
                <!-- render.js 會抓取這個 ID，把時間軸卡片塞進來 -->
                <div id="experience-timeline" class="timeline-container"></div>
            </section>
            
        </main>

        <!-- Footer 由 components.js 自動載入 footer.html -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- 腳本 -->
    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/components.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
