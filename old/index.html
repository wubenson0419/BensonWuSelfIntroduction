<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <!-- 確保行動裝置 (手機、平板) 有正確的 RWD 比例 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吳秉乾 - Benson Wu | Personal Website</title>
    <meta name="description" content="吳秉乾的自介網站，展示個人作品、攝影集和聯絡方式。">

    <!-- Meta & OG (用於分享時顯示的預覽卡片) -->
    <meta property="og:title" content="吳秉乾的自介網站">
    <meta property="og:description" content="一個從零開始，純手搓的自我介紹網站。">
    <meta property="og:image" content="https://bhwu.pages.dev/images/headportrait/myicon.webp">
    <meta property="og:url" content="https://bhwu.pages.dev">
    <meta property="og:type" content="website">
    <meta name="google-site-verification" content="DNEZQaTRX3U91vvFimb49qEBTfE01zcyzQN2f4USgB8" />
    <link rel="icon" type="image/webp" href="images/headportrait/myicon.webp">

    <!-- CSS 樣式表 -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav.css">
    <link rel="stylesheet" href="css/lightbox.css">
    <!-- 載入昭源圓體 .ttf -->
    <link rel="preload" href="fonts/ChironGoRoundTC-400R.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="fonts/ChironGoRoundTC-700B.ttf" as="font" type="font/ttf" crossorigin>
    <!-- Fonts & Icons 資源載入 -->
    <!-- FontAwesome: 專門用來顯示 IG, Github 等品牌 Logo -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Google Fonts: Inter (英文字體) 與 Noto Sans TC (繁體中文字體) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700&family=Source+Code+Pro:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Google Material Symbols: 用於網站的介面小圖示 (如箭頭、紙飛機) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />

    <meta name="theme-color" content="#0a0a0c">
</head>

<body>
    <!-- 
      導覽列佔位符 (Top Nav Placeholder)
      這裡原本的 nav.html 會透過 js/components.js 被塞進來。
      請維持不動以確保原本的側邊欄選單正常運作。
    -->
    <div id="nav-placeholder"></div>

    <div class="smooth-scroll-wrapper">

        <!-- ==============================================
             Hero Section (首頁大看板)
             這裡是網站的「門面」，負責給訪客第一眼的視覺震撼。
             F-Shaped Pattern：大標題在左，圖片在右。
        =============================================== -->
        <header class="hero-section">
            <div class="hero-content">
                <!-- 標題與副標題：副標題內容會由 data.js 中的 heroSubtitle 動態填入 -->
                <h1 class="hero-title">Hello, I'm <br><span class="accent-text" data-profile="nickname">Benson Wu</span>
                </h1>
                <p class="hero-subtitle" id="hero-subtitle">Photographer & Maker <br> Information Engineering Student
                </p>

                <!-- CTA (Call To Action) 按鈕，帶有 GSAP 磁吸效果 (magnetic-btn)
                <div class="hero-cta">
                    <a href="aboutme.html" class="btn btn-primary magnetic-btn">About Me</a>
                    <a href="highlight.html" class="btn btn-outline magnetic-btn">View Work</a>
                </div> -->
            </div>

            <div class="hero-image-container">
                <div class="hero-image-mask">
                    <img src="images/headportrait/S_11296777.webp" alt="Benson Wu" class="hero-image" fetchpriority="high">
                </div>
            </div>
        </header>

        <main>
            <!-- ==============================================
                 Bento Box (About Me 縮影)
                 首頁的個人資料預覽，使用整齊對稱的 2x2 網格。
                 這裡的內容會由 data.js 自動填入。
            =============================================== -->
            <section id="about" class="bento-section">
                <h2 class="section-heading" ><a href="aboutme.html">About Me</a></h2>
                <div class="bento-grid">

                    <!-- 卡片 1：姓名與生日 -->
                    <div class="bento-card bento-intro" data-scroll="fade-up" style="text-align: center; align-items: center;">
                        <h3><a href="aboutme.html">Profile</a></h3>
                        <!-- <h4 id="profile-name" style="font-size: 1.8rem; color: var(--text-main); margin-bottom: 10px;">吳秉乾</h4> -->
                        <h4><span data-profile="name">吳秉乾</span></h4>
                        <p><strong>Nickname:</strong> <span data-profile="nickname">BensonWu</span></p>
                        <p><strong>Birthday:</strong> <span id="profile-birthday">2009/04/19</span></p>
                    </div>

                    <!-- 卡片 2：學歷 -->
                    <div class="bento-card bento-edu" data-scroll="fade-up">
                        <h3><a href="aboutme.html">Education</a></h3>
                        <p id="profile-school">國立臺中科技大學</p>
                        <p id="profile-major">資訊工程科</p>
                        <p class="status" id="profile-status">就讀中</p>
                    </div>

                    <!-- 卡片 3：興趣 (內容將由 data.js 動態產生) -->
                    <div class="bento-card bento-hobbies" data-scroll="fade-up">
                        <h3><a href="aboutme.html">Interests</a></h3>
                        <div class="tags" id="interests-container">
                            <!-- JS 會在這裡產生 <span class="tag">...</span> -->
                        </div>
                    </div>

                    <!-- 卡片 4：社群連結 -->
                    <div class="bento-card bento-social" data-scroll="fade-up">
                        <h3><a href="callme.html">Connect</a></h3>
                        <div class="social-links-bento dynamic-social-links">
                            <!-- JS 會在這裡產生社群圖示 -->
                        </div>
                    </div>

                    <!-- 卡片 5：經驗與活動
                    <div class="bento-card bento-experience" data-scroll="fade-up">
                        <h3><a href="aboutme">Experiences</a></h3>
                        <div style="font-size: 3rem; margin: 10px 0;"><span class="material-symbols-outlined" style="font-size: 4rem; color: var(--accent-blue);">timeline</span></div>
                        <p style="font-size: 0.9rem;">My journey & activities</p>
                    </div>

                    卡片 6：聯絡資訊 (湊齊 6 個方塊達成對稱)
                    <div class="bento-card bento-contact-mini" data-scroll="fade-up">
                        <h3><a href="callme">Contact Me</a></h3>
                        <div style="font-size: 3rem; margin: 10px 0;"><span class="material-symbols-outlined" style="font-size: 4rem; color: var(--accent-blue);">mail</span></div>
                        <p style="font-size: 0.9rem;">Let's get in touch!</p>
                    </div> -->

                </div>
            </section>

            <!-- ==============================================
                 Gallery Section (精選作品)
                 這裡加上 data-limit="6"，讓 render.js 知道在首頁只需渲染 6 張圖片。
            =============================================== -->
            <section id="gallery" class="gallery-section">
                <div class="gallery-header">
                    <h2 class="section-heading"><a href="highlight.html">Featured Works</a></h2>
                    <a href="highlight.html" class="view-all-link">View All <span
                            class="material-symbols-outlined">arrow_forward</span></a>
                </div>

                <!-- 圖片將由 js/render.js 根據 js/data.js 中的陣列自動產生 -->
                <!-- 未來您若要換照片，只需修改 data.js，無需動這裡的 HTML！ -->
                <div class="gallery-grid" id="gallery-container" data-limit="12"></div>
            </section>

            <!-- ==============================================
                 Contact Section (聯絡資訊)
                 高質感的漸層卡片，讓訪客快速聯絡您。
            =============================================== -->
            <section id="contact" class="contact-section" data-scroll="fade-up">
                <div class="contact-card">
                    <h2 class="section-heading">Get in Touch</h2>
                    <p class="contact-desc">喜歡我的作品或是想交朋友嗎？隨時歡迎透過以下方式聯絡我！</p>
                    <!-- 點擊跳轉至我們接下來要重構的 callme.html -->
                    <a href="callme.html" class="btn btn-primary magnetic-btn contact-btn">
                        <span>聯絡資訊</span>
                        <span class="material-symbols-outlined">send</span>
                    </a>
                </div>
            </section>
        </main>

        <!-- Footer 由 components.js 自動載入 footer.html -->
        <div id="footer-placeholder"></div>
    </div>

    <!-- Lightbox 遮罩層 (給圖片放大用) -->
    <div id="lightbox" class="lightbox-overlay">
        <div class="lightbox-container">
            <button id="lightbox-close" class="lightbox-close-btn"><i class="fa-solid fa-xmark"></i></button>
            <div class="lightbox-content">
                <div class="lightbox-image-container">
                    <img id="lightbox-image" src="" alt="放大的圖片">
                </div>
                <div class="lightbox-text-container">
                    <h3 id="lightbox-title"></h3>
                    <p id="lightbox-description"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 腳本載入區塊 (依序載入：資料庫 -> 渲染器 -> 介面元件 -> 動畫引擎) -->
    <!-- 1. 核心資料庫 (以後要改字、改圖片都在這改！) -->
    <script src="js/data.js"></script>

    <!-- 2. 資料渲染器 (負責把 data.js 的資料塞進 HTML 中) -->
    <script src="js/render.js"></script>

    <!-- 3. 原有的 Menu 等介面元件 -->
    <script src="js/components.js"></script>

    <!-- Lightbox 控制腳本 -->
    <script src="js/lightbox.js"></script>

    <!-- 4. GSAP 動畫引擎 (Apple 質感動畫核心) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- 5. 自訂動畫腳本 -->
    <script src="js/animations.js"></script>
</body>

</html>
