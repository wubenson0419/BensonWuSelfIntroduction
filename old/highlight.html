<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Featured Works - Benson Wu</title>
    
    <link rel="icon" type="image/webp" href="images/headportrait/myicon.webp">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav.css">
    <!-- Lightbox CSS 給圖片放大功能使用 -->
    <link rel="stylesheet" href="css/lightbox.css">
    <!-- 載入昭源圓體 .ttf -->
    <link rel="preload" href="fonts/ChironGoRoundTC-400R.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="fonts/ChironGoRoundTC-700B.ttf" as="font" type="font/ttf" crossorigin>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <meta name="theme-color" content="#0a0a0c">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="smooth-scroll-wrapper">
        <main class="page-content-wrapper">
            
            <section class="gallery-section page-top-padding">
                <h1 class="page-title text-center" data-scroll="fade-up">Featured <span class="accent-text">Works</span></h1>
                <p class="text-center text-muted" data-scroll="fade-up" style="margin-bottom: 40px;">透過鏡頭記錄下的每一刻流光溢彩</p>
                
                <!-- ==============================================
                     畫廊網格
                     請注意這裡沒有設定 data-limit，所以 render.js 會載入 data.js 中的「所有」照片！
                =============================================== -->
                <div class="gallery-grid" id="gallery-container"></div>
            </section>
            <div>
                <a class="gallery-desc" href="https://wubenson0419.github.io/BensonWu_self-introduction/highlight.html">若想了解更多內容，可以點我去舊網站看看</a>
            </div>

        </main>

        <!-- Footer 由 components.js 自動載入 footer.html -->
        <div id="footer-placeholder"></div>
    </div>
    
    <!-- Lightbox 遮罩層 (給圖片放大用) -->
    <div id="lightbox" class="lightbox-overlay">
        <div class="lightbox-container">
            <button id="lightbox-close" class="lightbox-close-btn"><i class="fa-solid fa-xmark"></i></button>
            <div class="lightbox-content">
                <div class="lightbox-image-container">
                    <img id="lightbox-image" src="" alt="放大的圖片">
                </div>
                <div class="lightbox-text-container">
                    <h3 id="lightbox-title"></h3>
                    <p id="lightbox-description"></p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 腳本 -->
    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/components.js"></script>
    <script src="js/lightbox.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
